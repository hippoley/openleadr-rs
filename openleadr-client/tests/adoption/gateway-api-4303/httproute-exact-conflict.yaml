# Transplant draft for kubernetes-sigs/gateway-api#4303.
# The final upstream test must determine the winner from actual creationTimestamp;
# namespace/name is only the normative tie-break if timestamps are equal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: exact-conflict-a
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: same-namespace
  rules:
  - matches:
    - path:
        type: Exact
        value: /exact-conflict
    backendRefs:
    - name: infra-backend-v1
      port: 8080
