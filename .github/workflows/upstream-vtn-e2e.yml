name: Live upstream VTN E2E evidence

on:
  push:
    branches:
      - feat/external-vtn-readonly-conformance-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-vtn-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: openadr
          POSTGRES_PASSWORD: openadr
          POSTGRES_DB: openadr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openadr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://openadr:openadr@localhost:5432/openadr
      OAUTH_TOKEN_URL: http://127.0.0.1:3000/auth/token
      OAUTH_VALID_AUDIENCES: http://127.0.0.1:3000
      OPENLEADR_RS_VTN_URL: http://127.0.0.1:3000/
      OPENLEADR_RS_CLIENT_ID: bl-client
      OPENLEADR_RS_CLIENT_SECRET: bl-client
      SQLX_OFFLINE: "true"
      RUST_LOG: openleadr_vtn=info
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Install existing mature cargo-nextest runner
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build real VTN and external VEN probes
        run: |
          cargo build -p openleadr-vtn --bin openleadr-vtn --features internal-oauth
          cargo test -p openleadr-client --test external_vtn_readonly --no-run
      - name: Migrate and seed dedicated database
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f fixtures/users.sql > seed.log 2>&1 || {
            echo "Initial seed needs migrations; applying schema via VTN startup."
            cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features postgres
            cargo sqlx migrate run --source openleadr-vtn/migrations
            psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f fixtures/users.sql > seed.log 2>&1
          }
      - name: Start real upstream VTN process
        run: |
          ./target/debug/openleadr-vtn > vtn.log 2>&1 &
          echo $! > vtn.pid
          ready=0
          for n in $(seq 1 45); do
            if bash -c 'echo >/dev/tcp/127.0.0.1/3000' 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat vtn.pid)" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat vtn.log; exit 1; fi
          sleep 2
          kill -0 "$(cat vtn.pid)" || { cat vtn.log; exit 1; }
      - name: Execute real network Program and Event list
        run: |
          set -o pipefail
          cargo nextest run -p openleadr-client --test external_vtn_readonly --profile issue53 --run-ignored only --no-tests fail --test-threads 1 2>&1 | tee readonly-e2e.log
          python3 benchmarks/issue53/verify_junit.py target/nextest/issue53/junit.xml --output issue53-e2e-receipt.json
          git rev-parse HEAD > issue53-tested-sha.txt
          sha256sum target/nextest/issue53/junit.xml readonly-e2e.log vtn.log issue53-e2e-receipt.json > issue53-sha256.txt
      - name: Preserve reviewable real-service evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-vtn-readonly-e2e
          if-no-files-found: warn
          path: |
            vtn.log
            readonly-e2e.log
            seed.log
            target/nextest/issue53/junit.xml
            issue53-e2e-receipt.json
            issue53-tested-sha.txt
            issue53-sha256.txt
          retention-days: 30
